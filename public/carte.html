<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f2e8">
  <title>دار رزيزة | Rziza House — بطاقة</title>
  <meta name="description" content="دار رزيزة — رزيزة، مسمن، حرشة وبغرير مصاوبين فالدار بسلا. سجلو الرقم، طلبو عبر واتساب.">
  <!-- Carte de visite ouverte par les cartes NFC : pas besoin d'apparaître dans Google -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;700&family=Amiri:wght@700&display=swap">
  <style>
    :root {
      --cream: #f8f2e8;
      --paper: #fffdf8;
      --ink: #292b20;
      --muted: #777568;
      --olive: #565b38;
      --olive-dark: #353b27;
      --terracotta: #b96947;
      --gold: #d8a77c;
      --line: #e7dfd1;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(circle at 50% 0%, #fffaf1, var(--cream) 60%);
      color: var(--ink);
      font-family: "Noto Sans Arabic", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 50px #3a33201a;
      overflow: hidden;
      text-align: center;
    }
    /* Olive arch at the top, like the arches on the website */
    .top {
      position: relative;
      padding: 34px 24px 26px;
      background: radial-gradient(circle at 50% 20%, #6b7149, #3f4428 85%);
      color: #fff7e9;
    }
    .top::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid #d8a77c66;
      border-radius: 12px;
      pointer-events: none;
    }
    .logo {
      display: block;
      height: 64px;
      width: auto;
      margin: 0 auto 10px;
      padding: 8px 12px;
      background: var(--cream);
      border-radius: 14px;
    }
    h1 {
      margin: 6px 0 2px;
      font-family: "Amiri", serif;
      font-size: 40px;
      line-height: 1.3;
    }
    .latin {
      font-family: "DM Sans", sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--gold);
    }
    .tagline {
      margin: 14px 0 0;
      font-size: 14px;
      line-height: 1.8;
      color: #f1e4cc;
    }
    .actions {
      display: grid;
      gap: 12px;
      padding: 24px 22px 8px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      text-align: start;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn svg {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn span {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .btn strong {
      font-size: 16px;
    }
    .btn small {
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      color: var(--muted);
    }
    .btn.primary {
      background: var(--olive);
      border-color: var(--olive);
      color: #fff8eb;
    }
    .btn.primary small {
      color: #e3d8bd;
    }
    .btn.whatsapp {
      background: var(--terracotta);
      border-color: var(--terracotta);
      color: #fff8eb;
    }
    .btn.whatsapp small {
      color: #f6dccd;
    }
    .info {
      margin: 14px 22px 0;
      padding: 16px 0 22px;
      border-top: 1px dashed var(--line);
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .info p {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .info svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: var(--terracotta);
      stroke-width: 1.7;
    }
    .phone {
      direction: ltr;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      color: var(--ink);
    }
  </style>
  <script src="products.js" defer></script>
</head>
<body>
  <main class="card">
    <header class="top">
      <img class="logo" src="images/logo-mark.png" alt="" width="120" height="64">
      <!-- &#8202; : the tail of ز hides the dots of ي without this thin space -->
      <h1>دار رز&#8202;يزة</h1>
      <div class="latin">RZIZA HOUSE</div>
      <p class="tagline">رز&#8202;يزة، مسمن، حرشة وبغرير<br>مصاوبين فالدار، بالنية والمحبة</p>
    </header>

    <nav class="actions">
      <a class="btn primary" id="saveContact" href="rziza-house.vcf">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 20c.6-3.6 3.2-5.6 6.5-5.6 1.6 0 3 .4 4.1 1.2"/><path d="M18 13.5v6M15 16.5h6"/></svg>
        <span><strong>سجل الرقم ديالنا</strong><small>Enregistrer le contact</small></span>
      </a>
      <a class="btn whatsapp" id="whatsapp" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5l1.4-4.1A8.3 8.3 0 1 1 8.6 19.4L4 20.5Z"/><path d="M9.2 8.6c-.3 2.9 3.3 6.5 6.2 6.2l.6-1.6-2-1-.9.8c-1-.4-1.9-1.3-2.3-2.3l.8-.9-1-2-1.4.8Z"/></svg>
        <span><strong>راسلنا فواتساب</strong><small>Écrire sur WhatsApp</small></span>
      </a>
      <a class="btn" id="call" href="#">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 3.5h3l1.4 4.3-2 1.4a12 12 0 0 0 5.8 5.8l1.4-2 4.3 1.4v3a2 2 0 0 1-2.2 2C10.6 18.9 5.1 13.4 4.6 5.7a2 2 0 0 1 2-2.2Z"/></svg>
        <span><strong>عيط لينا</strong><small>Appeler</small></span>
      </a>
      <a class="btn" href="./#produits">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l-1.1 12.5H6.6L5.5 8Z"/><path d="M9 10V6.8a3 3 0 0 1 6 0V10"/></svg>
        <span><strong>شوف المنتوجات وطلب</strong><small>Voir les produits et commander</small></span>
      </a>
    </nav>

    <footer class="info">
      <p><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5s-6.5-5.8-6.5-11.5a6.5 6.5 0 0 1 13 0c0 5.7-6.5 11.5-6.5 11.5Z"/><circle cx="12" cy="10" r="2.3"/></svg><span id="delivery">التوصيل مجاني فسلا · 10 درهم للرباط</span></p>
      <p><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>كل نهار · من 8 الصباح حتى 8 الليل</span></p>
      <p class="phone" id="phone"></p>
    </footer>
  </main>

  <script>
    // Number and delivery fee come from products.js, like on the main site.
    window.addEventListener("DOMContentLoaded", () => {
      const number = WHATSAPP_NUMBER;
      const local = number.slice(3);
      const message = "السلام عليكم دار رزيزة";
      document.getElementById("whatsapp").href = "https://wa.me/" + number + "?text=" + encodeURIComponent(message);
      document.getElementById("call").href = "tel:+" + number;
      document.getElementById("phone").textContent =
        "+" + number.slice(0, 3) + " " + local[0] + " " + local.slice(1).replace(/(\d{2})(?=\d)/g, "$1 ");
      const rabat = DELIVERY_FEES.rabat;
      document.getElementById("delivery").textContent =
        (DELIVERY_FEES.sale ? "التوصيل لسلا " + DELIVERY_FEES.sale + " درهم" : "التوصيل مجاني فسلا") + " · " + rabat + " درهم للرباط";
    });
  </script>
</body>
</html>
